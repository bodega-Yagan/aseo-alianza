<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pedidos de Aseo Alianza</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3366">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aseo Alianza">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root{--az:#0f3366;--az2:#1c4f96;--cl:#eef3fa;--ok:#1e8a4c;--warn:#d98a00;--bad:#c0392b;--tx:#1d2733;--gr:#6b7785}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f9;color:var(--tx);font-size:16px}
  header{background:var(--az);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:18px;margin:0}
  header small{opacity:.8;display:block;font-size:13px}
  .salir{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
  main{padding:14px;max-width:640px;margin:0 auto;padding-bottom:110px}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
  label{display:block;font-weight:600;margin:12px 0 6px}
  select,input,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #c9d2dd;border-radius:10px;background:#fff}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;margin-top:14px;background:var(--az2);color:#fff}
  .btn.sec{background:#e3e9f2;color:var(--az)}
  .btn.ok{background:var(--ok)}
  .btn:disabled{opacity:.5}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:12px;border-radius:10px;border:0;background:#e3e9f2;color:var(--az);font-weight:700;font-size:15px}
  .tabs button.act{background:var(--az);color:#fff}
  .prod{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f4;gap:10px}
  .prod:last-child{border-bottom:0}
  .prod .n{flex:1;font-size:15px}
  .prod .n small{color:var(--gr);display:block}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:50%;border:0;background:#e3e9f2;color:var(--az);font-size:22px;font-weight:700}
  .step input{width:56px;text-align:center;padding:8px 4px;font-size:17px}
  .prod.sel{background:var(--cl);margin:0 -16px;padding:10px 16px}
  .barra{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px 16px;box-shadow:0 -2px 8px #0002}
  .barra .btn{margin:0 auto;max-width:612px}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
  .PENDIENTE{background:var(--warn)} .COMPLETO,.ENTREGADO-COMPLETO{background:var(--ok)}
  .PARCIAL,.ENTREGADO-PARCIAL{background:#e67e22} .NO-ENTREGADO{background:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{padding:7px 4px;border-bottom:1px solid #edf0f4;text-align:left}
  th.c,td.c{text-align:center}
  td.falta{color:var(--bad);font-weight:700}
  .muted{color:var(--gr);font-size:14px}
  .ped-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ped-h b{font-size:16px}
  .ent input{width:64px;text-align:center;padding:8px 4px}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:20;max-width:90%;text-align:center}
  #cargando{position:fixed;inset:0;background:#fff9;display:none;align-items:center;justify-content:center;z-index:30;font-weight:700;color:var(--az)}
  .vacio{text-align:center;color:var(--gr);padding:24px}
  .docbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--cl);border-radius:10px;padding:10px;margin:10px 0 4px}
  .docbox.pend{grid-template-columns:1fr;background:#fff4e0}
  .docbox span{display:block;font-size:12px;color:var(--gr)}
  .docbox b{font-size:15px}
  td.okc{color:var(--ok);font-weight:700}
  tr.tot td{font-weight:700;border-top:2px solid #c9d2dd}
  tr.sinb td{border-bottom:0;padding-bottom:2px}
  input.obsl{font-size:14px;padding:8px 10px;background:#fafbfd}
  .obsp{font-size:12px;color:#8a5a00;margin-top:2px}
  .hlogo{width:40px;height:40px;background:#fff;border-radius:10px;padding:2px;flex:none}
  .hizq{display:flex;align-items:center;gap:10px}
  .logo-ini{display:block;width:150px;height:150px;margin:0 auto 10px;border-radius:22px;box-shadow:0 1px 3px #0001}
  .linea{border:1px solid #e3e9f2;border-radius:12px;padding:10px;margin-top:10px;background:#fbfcfe}
  .lin-h{display:flex;justify-content:space-between;gap:8px;font-size:15px;align-items:baseline}
  .lin-h span{font-size:13px;color:var(--gr);white-space:nowrap}
  .lin-c{display:flex;gap:8px;margin:8px 0}
  .lin-c>div{flex:1}
  .lin-c span{display:block;font-size:12px;color:var(--gr);margin-bottom:3px}
  .lin-c input,.lin-c select{padding:10px;font-size:16px}
  td.otra{color:#8a5a00;font-weight:700}
  .OTRA-UNIDAD{background:#8a5a00}
  .lnk{background:none;border:0;color:var(--az2);text-decoration:underline;font-size:15px;margin-top:18px;width:100%}
</style>
</head>
<body>
<header>
  <div class="hizq"><img class="hlogo" src="" alt=""><div><h1>Pedidos de Aseo</h1><small id="subt">Alianza Seguridad</small></div></div>
  <button class="salir" id="btnSalir" style="display:none" onclick="salir()">Salir</button>
</header>
<main id="app"></main>
<div id="toast"></div>
<datalist id="motivos">
  <option value="Sin stock en bodega">
  <option value="Se entrega en otro formato (ml / cc)">
  <option value="Se entrega menos: aún tiene stock del pedido anterior">
  <option value="Producto por llegar (en compra)">
  <option value="Cantidad excede el consumo normal">
</datalist>
<div id="cargando">Cargando…</div>

var S = {personal:[], productos:[], user:null, pin:'', admin:null, clave:'', cant:{}, tab:'nuevo', atab:'pend', pend:[]};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},3200)}
function carga(b){$('cargando').style.display=b?'flex':'none'}
var API_URL='PEGAR_AQUI_URL_EXEC';
function call(fn,args,ok){
  carga(true);
  if(!(window.google&&google.script&&google.script.run)){
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})})
      .then(function(r){return r.json()})
      .then(function(x){carga(false);if(x.ok)ok(x.data);else toast(x.error||'Error')})
      .catch(function(){carga(false);toast('Sin conexión. Intenta de nuevo.')});
    return;
  }
  var r=google.script.run.withSuccessHandler(function(x){carga(false);ok(x)})
    .withFailureHandler(function(e){carga(false);toast(e.message||String(e))});
  r[fn].apply(r,args||[]);
}
function guardar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function leer(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function borrar(k){try{localStorage.removeItem(k)}catch(e){}}
function badge(e){return '<span class="badge '+esc(String(e).replace(/ /g,'-'))+'">'+esc(e)+'</span>'}

/* ---------- Inicio ---------- */
function init(){
  call('getInicio',[],function(d){
    S.personal=d.personal;S.productos=d.productos;
    var u=leer('aseo_user');
    var a=leer('aseo_admin');
    if(a&&a.clave){S.clave=a.clave;S.admin=a.nombre;return vistaAdmin()}
    if(u&&u.nombre&&S.personal.indexOf(u.nombre)>=0){S.user=u.nombre;S.pin=u.pin||'';return vistaPersona()}
    vistaLogin();
  });
}

function vistaLogin(){
  $('btnSalir').style.display='none';$('subt').textContent='Alianza Seguridad';
  var ops=S.personal.map(function(n){return '<option>'+esc(n)+'</option>'}).join('');
  $('app').innerHTML=
   '<img class="logo-ini" src="'+LOGO+'" alt="Servicio de Aseo">'+
   '<div class="card"><h2 style="margin:0 0 4px">¡Hola!</h2><div class="muted">Elige tu nombre para hacer un pedido de productos de aseo.</div>'+
   '<label>Tu nombre</label><select id="lgN"><option value="">— Selecciona —</option>'+ops+'</select>'+
   '<label>PIN (si tienes uno)</label><input id="lgP" type="password" inputmode="numeric" maxlength="6" placeholder="••••">'+
   '<button class="btn" onclick="entrar()">Entrar</button>'+
   (S.personal.length?'':'<p class="muted">Aún no hay personas cargadas en la hoja Personal.</p>')+
   '</div><button class="lnk" onclick="vistaLoginAdmin()">Soy encargado de bodega</button>';
}
function entrar(){
  var n=$('lgN').value,p=$('lgP').value;
  if(!n)return toast('Selecciona tu nombre');
  call('login',[n,p],function(){S.user=n;S.pin=p;guardar('aseo_user',{nombre:n,pin:p});S.cant={};S.tab='nuevo';vistaPersona()});
}
function vistaLoginAdmin(){
  $('app').innerHTML='<div class="card"><h2 style="margin:0 0 4px">Encargado</h2><div class="muted">Registra lo que realmente se entregó.</div>'+
   '<label>Clave</label><input id="adC" type="password">'+
   '<button class="btn" onclick="entrarAdmin()">Entrar</button><button class="btn sec" onclick="vistaLogin()">Volver</button></div>';
}
function entrarAdmin(){
  var c=$('adC').value;
  call('adminLogin',[c],function(r){S.clave=c;S.admin=r.nombre;guardar('aseo_admin',{clave:c,nombre:r.nombre});S.atab='pend';vistaAdmin()});
}
function salir(){borrar('aseo_user');borrar('aseo_admin');S.user=null;S.admin=null;S.clave='';S.pin='';S.cant={};vistaLogin()}

/* ---------- Personal de aseo ---------- */
function vistaPersona(){
  $('btnSalir').style.display='block';$('subt').textContent=S.user;
  var h='<div class="tabs"><button class="'+(S.tab==='nuevo'?'act':'')+'" onclick="S.tab=\'nuevo\';vistaPersona()">Nuevo pedido</button>'+
        '<button class="'+(S.tab==='mis'?'act':'')+'" onclick="S.tab=\'mis\';vistaPersona()">Mis pedidos</button></div><div id="cont"></div>';
  $('app').innerHTML=h;
  if(S.tab==='nuevo')pintarNuevo();else cargarMis();
}
function pintarNuevo(){
  var h='<div class="card"><input id="busca" placeholder="Buscar producto…" oninput="filtrar()"><div id="lista" style="margin-top:8px"></div></div>'+
        '<div class="card"><label style="margin-top:0">Comentario (opcional)</label><textarea id="coment" rows="2" placeholder="Ej: para baños 2° piso"></textarea></div>'+
        '<div class="barra"><button class="btn ok" id="btnEnv" onclick="revisar()">Enviar pedido</button></div>';
  $('cont').innerHTML=h;filtrar();actBarra();
}
function filtrar(){
  var q=($('busca').value||'').toLowerCase();
  var h=S.productos.map(function(p,i){
    if(q&&p.nombre.toLowerCase().indexOf(q)<0)return '';
    var c=S.cant[p.nombre]||0;
    return '<div class="prod'+(c?' sel':'')+'" id="pr'+i+'"><div class="n">'+esc(p.nombre)+'<small>'+esc(p.unidad)+'</small></div>'+
      '<div class="step"><button onclick="mas('+i+',-1)">−</button><input type="number" min="0" inputmode="numeric" value="'+(c||'')+'" placeholder="0" onchange="setC('+i+',this.value)"><button onclick="mas('+i+',1)">+</button></div></div>';
  }).join('');
  $('lista').innerHTML=h||'<div class="vacio">Sin resultados</div>';
}
function setC(i,v){var n=S.productos[i].nombre;v=Math.max(0,parseInt(v,10)||0);if(v)S.cant[n]=v;else delete S.cant[n];filtrar();actBarra()}
function mas(i,d){var n=S.productos[i].nombre;setC(i,(S.cant[n]||0)+d)}
function items(){return Object.keys(S.cant).map(function(k){return {producto:k,cantidad:S.cant[k]}})}
function actBarra(){var it=items(),t=it.reduce(function(s,x){return s+x.cantidad},0);var b=$('btnEnv');if(!b)return;b.disabled=!it.length;b.textContent=it.length?('Enviar pedido ('+it.length+' productos, '+t+' uds)'):'Elige productos'}
function revisar(){
  var it=items();if(!it.length)return;
  var com=$('coment').value;
  var h='<div class="card"><h3 style="margin-top:0">Revisa tu pedido</h3><table><tr><th>Producto</th><th class="c">Cant.</th></tr>'+
    it.map(function(x){return '<tr><td>'+esc(x.producto)+'</td><td class="c">'+x.cantidad+'</td></tr>'}).join('')+'</table>'+
    (com?'<p class="muted">Comentario: '+esc(com)+'</p>':'')+
    '<button class="btn ok" onclick="enviar()">Confirmar y enviar</button><button class="btn sec" onclick="pintarNuevo()">Modificar</button></div>';
  S._com=com;$('cont').innerHTML=h;
}
function enviar(){
  call('crearPedido',[S.user,S.pin,items(),S._com||''],function(r){
    S.cant={};S._com='';
    $('cont').innerHTML='<div class="card" style="text-align:center"><div style="font-size:48px">✅</div><h3>Pedido enviado</h3><p>Folio <b>'+esc(r.folio)+'</b></p>'+
      '<button class="btn" onclick="S.tab=\'mis\';vistaPersona()">Ver mis pedidos</button><button class="btn sec" onclick="vistaPersona()">Hacer otro pedido</button></div>';
  });
}
function cargarMis(){
  call('misPedidos',[S.user,S.pin],function(l){
    if(!l.length){$('cont').innerHTML='<div class="vacio">Todavía no tienes pedidos.</div>';return}
    $('cont').innerHTML=l.map(tarjetaPedido).join('');
  });
}
var UNIDADES=['Unidad','Litros','CC','ML'];
function ab(u){return {Litros:'LT',CC:'CC',ML:'ML'}[u]||''}
function cu(n,u){var a=ab(u);return n+(a?' '+a:'')}
function tarjetaPedido(p){
  var ent=p.estado!=='PENDIENTE';
  var info=ent
    ? '<div class="docbox"><div><span>N° documento</span><b>'+esc(p.nEntrega||'-')+'</b></div>'+
      '<div><span>Fecha entrega</span><b>'+esc(p.fechaEntrega||'-')+'</b></div>'+
      (p.docErp?'<div><span>Doc. ERP / guía</span><b>'+esc(p.docErp)+'</b></div>':'')+
      '<div><span>Entregado por</span><b>'+esc(p.entregadoPor||'-')+'</b></div></div>'
    : '<div class="docbox pend"><div><span>Entrega</span><b>Pendiente</b></div></div>';
  var filas=p.lineas.map(function(l){
    var uP=l.unidadPed||'Unidad', uE=l.unidadEnt||uP;
    var e=ent?(l.entregada==null?0:l.entregada):null;
    var otra=ent&&e>0&&uE!==uP;
    var dif=ent&&!otra?Math.max(0,l.solicitada-e):null;
    return '<tr><td>'+esc(l.producto)+(l.obs?'<div class="obsp">📝 '+esc(l.obs)+'</div>':'')+'</td>'+
      '<td class="c">'+esc(cu(l.solicitada,uP))+'</td>'+
      '<td class="c '+(ent?(otra?'otra':(dif>0?'falta':'okc')):'')+'">'+(ent?esc(cu(e,uE)):'—')+'</td>'+
      (ent?'<td class="c '+(dif>0?'falta':'')+'">'+(otra?'—':esc(cu(dif,uP)))+'</td>':'')+'</tr>';
  }).join('');
  return '<div class="card"><div class="ped-h"><b>Pedido '+esc(p.folio)+'</b>'+badge(p.estado)+'</div>'+
   '<div class="muted">Pedido el '+esc(p.fecha)+(p.solicitante&&S.admin?' · '+esc(p.solicitante):'')+'</div>'+
   (p.comentario?'<div class="muted">💬 '+esc(p.comentario)+'</div>':'')+info+
   '<table><tr><th>Producto</th><th class="c">Pedido</th><th class="c">Entregado</th>'+(ent?'<th class="c">Faltó</th>':'')+'</tr>'+filas+'</table>'+
   (ent&&p.obs?'<div class="muted" style="margin-top:6px">📝 '+esc(p.obs)+'</div>':'')+'</div>';
}

/* ---------- Encargado ---------- */
function vistaAdmin(){
  $('btnSalir').style.display='block';$('subt').textContent='Encargado: '+S.admin;
  $('app').innerHTML='<div class="tabs"><button class="'+(S.atab==='pend'?'act':'')+'" onclick="S.atab=\'pend\';vistaAdmin()">Por entregar</button>'+
    '<button class="'+(S.atab==='hist'?'act':'')+'" onclick="S.atab=\'hist\';vistaAdmin()">Historial</button></div><div id="cont"></div>';
  if(S.atab==='pend')cargarPend();else cargarHist();
}
function cargarPend(){
  call('getPendientes',[S.clave],function(l){
    S.pend=l;
    if(!l.length){$('cont').innerHTML='<div class="vacio">No hay pedidos pendientes 👌</div>';return}
    $('cont').innerHTML=l.map(function(p,i){
      return '<div class="card"><div class="ped-h"><b>'+esc(p.folio)+'</b>'+badge(p.estado)+'</div>'+
       '<div class="muted">'+esc(p.fecha)+' · <b>'+esc(p.solicitante)+'</b></div>'+
       (p.comentario?'<div class="muted">💬 '+esc(p.comentario)+'</div>':'')+
       p.lineas.map(function(l,j){
         var uP=l.unidadPed||'Unidad';
         var ops=UNIDADES.map(function(u){return '<option'+(u===uP?' selected':'')+'>'+u+'</option>'}).join('');
         return '<div class="linea"><div class="lin-h"><b>'+esc(l.producto)+'</b><span>Pidió: <b>'+esc(cu(l.solicitada,uP))+'</b></span></div>'+
           '<div class="lin-c"><div><span>Cantidad entregada</span><input type="number" min="0" step="any" inputmode="decimal" id="e'+i+'_'+j+'" value="'+l.solicitada+'"></div>'+
           '<div><span>Unidad de medida</span><select id="u'+i+'_'+j+'">'+ops+'</select></div></div>'+
           '<input class="obsl" id="ol'+i+'_'+j+'" list="motivos" placeholder="Observación (opcional)"></div>';
       }).join('')+
       '<label>N° documento ERP / guía (opcional)</label><input id="d'+i+'" placeholder="Ej: vale de salida 1234">'+
       '<label>Observación general (opcional)</label><input id="o'+i+'" placeholder="Ej: entrega en dos partes">'+
       '<button class="btn ok" onclick="entregar('+i+')">Registrar entrega</button></div>';
    }).join('');
  });
}
function entregar(i){
  var p=S.pend[i];
  var lin=p.lineas.map(function(l,j){
    var v=parseFloat(String($('e'+i+'_'+j).value).replace(',','.'));
    return {producto:l.producto,entregada:isNaN(v)?0:Math.max(0,v),unidad:$('u'+i+'_'+j).value,obs:$('ol'+i+'_'+j).value};
  });
  var menos=0,otra=0,nada=0;
  p.lineas.forEach(function(l,j){var x=lin[j];if(x.entregada<=0)nada++;else if(x.unidad!==(l.unidadPed||'Unidad'))otra++;else if(x.entregada<l.solicitada)menos++;});
  var partes=[];if(nada)partes.push(nada+' sin entregar');if(menos)partes.push(menos+' con menos cantidad');if(otra)partes.push(otra+' en otra unidad de medida');
  var msg=partes.length?('Productos: '+partes.join(', ')+'. ¿Confirmar entrega?'):'Entrega completa. ¿Confirmar?';
  if(!confirmar(msg))return;
  call('registrarEntrega',[S.clave,p.folio,lin,$('o'+i).value,$('d'+i).value],function(r){toast(p.folio+': '+r.estado+' · Doc '+r.nEntrega);cargarPend()});
}
function confirmar(m){try{return window.confirm(m)}catch(e){return true}}
function cargarHist(){
  call('getHistorial',[S.clave],function(l){
    if(!l.length){$('cont').innerHTML='<div class="vacio">Sin entregas registradas.</div>';return}
    $('cont').innerHTML=l.map(tarjetaPedido).join('');
  });
}

document.querySelector('.hlogo').src=LOGO;
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
init();
</script>
</body>
